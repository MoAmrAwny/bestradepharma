<div class="wrap">
  <div class="masthead">
    <img src="{{ASSETS}}/logo.webp" alt="{{SITE_NAME}}" width="27" height="28">
    <span class="mark">{{SITE_NAME}}</span>
  </div>

  <div class="bar">
    <span class="sub" id="reg"></span>
    <button class="topback" type="button" id="topback"><span class="arw" id="topbackarrow"></span><span id="topbacktext"></span></button>
    <span class="lang">
      <button type="button" data-lang="ar" aria-pressed="true">العربية</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
    </span>
  </div>

  <header class="hero">
    <h1 id="title"></h1>
    <p id="tagline"></p>
  </header>

  <h2 id="chooseDoor"></h2>
  <p class="sub" id="doorHint"></p>
  <div class="doors" id="doors"></div>

  <main id="main"></main>
  <button class="backlink" type="button" id="back"></button>
  <p class="foot" id="disclaimer"></p>
</div>
